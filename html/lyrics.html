<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poetic Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        p {
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
            line-height: 1.6;
        }
    </style>
    <script src="../scripts/timeScript.js"></script>
</head>

<body>
<p>
    Я бежал подороге<br>
    Подкосили ноги<br>
    Упал в большую какашку<br>
    Теперь черкаш на рубашке<br>
    Не успел придумать дальше<br>
    Пока писал html попил кваса<br>
    И пошел спать уставшим
</p>
</body>
</html>
